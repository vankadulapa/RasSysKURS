<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Подразделения')}"></head>
<body>
<header th:replace="~{fragments :: navbar('departments')}"></header>

<main class="container">
    <div class="page-head">
        <div>
            <h1>Подразделения</h1>
            <div class="subtitle">Отделы и кабинеты организации</div>
        </div>
    </div>

    <div class="alert alert-ok" th:if="${message}" th:text="${message}"></div>
    <div class="alert alert-err" th:if="${error}" th:text="${error}"></div>

    <section class="card">
        <h2 class="section-title">Новое подразделение</h2>
        <form th:action="@{/departments/add}" method="post" class="toolbar" style="margin-bottom:0">
            <input type="text" name="name" placeholder="Название" required>
            <input type="text" name="room" placeholder="Кабинет">
            <button type="submit" class="btn btn-primary">Добавить</button>
        </form>
    </section>

    <section class="card">
        <form th:action="@{/departments}" method="get" class="toolbar">
            <input type="text" name="q" th:value="${q}" class="grow" placeholder="Поиск по названию или кабинету">
            <button type="submit" class="btn btn-primary">Найти</button>
            <a class="btn btn-ghost" th:href="@{/departments}">Сбросить</a>
        </form>
        <div class="table-wrap">
            <table>
                <thead><tr><th>Название</th><th>Кабинет</th><th>Действия</th></tr></thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(items)}">
                        <td colspan="3" class="empty">Ничего не найдено</td>
                    </tr>
                    <tr th:each="d : ${items}">
                        <td><b th:text="${d.name}"></b></td>
                        <td th:text="${d.room} ?: '—'"></td>
                        <td>
                            <form th:action="@{/departments/{id}/delete(id=${d.id})}" method="post"
                                  onsubmit="return confirm('Удалить подразделение?');">
                                <button type="submit" class="btn btn-danger btn-sm">Удалить</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
