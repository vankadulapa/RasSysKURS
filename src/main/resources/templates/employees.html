<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Сотрудники')}"></head>
<body>
<header th:replace="~{fragments :: navbar('employees')}"></header>

<main class="container">
    <div class="page-head">
        <div>
            <h1>Сотрудники</h1>
            <div class="subtitle">Работники и их подразделения</div>
        </div>
    </div>

    <div class="alert alert-ok" th:if="${message}" th:text="${message}"></div>
    <div class="alert alert-err" th:if="${error}" th:text="${error}"></div>

    <section class="card">
        <h2 class="section-title">Новый сотрудник</h2>
        <form th:action="@{/employees/add}" method="post" class="toolbar" style="margin-bottom:0">
            <input type="text" name="fullName" placeholder="ФИО" required>
            <input type="text" name="position" placeholder="Должность">
            <input type="text" name="phone" placeholder="Телефон">
            <select name="departmentId" required>
                <option value="">— подразделение —</option>
                <option th:each="d : ${departments}" th:value="${d.id}" th:text="${d.name}"></option>
            </select>
            <button type="submit" class="btn btn-primary">Добавить</button>
        </form>
    </section>

    <section class="card">
        <form th:action="@{/employees}" method="get" class="toolbar">
            <input type="text" name="q" th:value="${q}" class="grow"
                   placeholder="Поиск: ФИО, должность, телефон, подразделение">
            <button type="submit" class="btn btn-primary">Найти</button>
            <a class="btn btn-ghost" th:href="@{/employees}">Сбросить</a>
        </form>
        <div class="table-wrap">
            <table>
                <thead>
                    <tr><th>ФИО</th><th>Должность</th><th>Телефон</th><th>Подразделение</th><th>Действия</th></tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(items)}">
                        <td colspan="5" class="empty">Ничего не найдено</td>
                    </tr>
                    <tr th:each="e : ${items}">
                        <td><b th:text="${e.fullName}"></b></td>
                        <td th:text="${e.position} ?: '—'"></td>
                        <td th:text="${e.phone} ?: '—'"></td>
                        <td th:text="${e.department.name}"></td>
                        <td>
                            <form th:action="@{/employees/{id}/delete(id=${e.id})}" method="post"
                                  onsubmit="return confirm('Удалить сотрудника?');">
                                <button type="submit" class="btn btn-danger btn-sm">Удалить</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
